# The Roomba button pack -- task 7.2.
#
# A `module`: one button that drives a robot vacuum through the four states
# `spec.txt:58` names -- idle starts, cleaning sends home, paused resumes, stuck
# notifies. The four are four behaviours, one per act, so the manifest states the
# set of things the button may do and the interpreter proposes through the
# declared slots and services.
#
# **The dispatch, and the clause that carries it.** The spec describes a
# *dispatch*: which act follows depends on the vacuum's current state.
# `pack-manifest/1.3.0`'s `match` clause is the value beside the `condition`
# kind -- the readings a behaviour acts on -- and each of the four below names the
# state it answers, so the dispatch is the four behaviours gating each other out
# rather than a `choose` block: `start_cleaning` proposes only when the vacuum
# reads `docked` or `idle`, `send_home` only when it reads `cleaning`, and so on.
# That keeps `catalog/pack-policy.yaml`'s declarative subset intact -- a pack
# still expresses intent rather than branching, because `match` is a literal the
# schema checks and not a test the engine evaluates.
#
# `vacuum.start` covers both "idle starts" and "paused resumes", which is what the
# vocabulary's two transitions have in common; the two are separate behaviours
# with separate `match` lists so a house can enable them apart.
#
# **`notify_stuck` gates on `error` and still proposes nothing**, and the two are
# different facts. Its `match` is what stops it firing whenever the robot is
# healthy; `notify.send_message` raises an event rather than writing a state, so
# it has no row in `catalog/services.yaml` and the port -- which takes a state --
# cannot carry it. Widening the port to carry a service call is what closes that
# half (`catalog/services.yaml`'s docstring anticipates it), and until then a
# stuck robot is recognised but not reported.
#
# The stuck notification reaches no slot: `notify.send_message` is not an act on
# a device in the house, so the behaviour declares it with an empty `slots`
# clause. A behaviour whose action is a service and whose slots are empty is
# admitted by the schema, and the sandbox refuses nothing because there is no
# entity for it to reach past.
name: roomba
version: "1.0.0"
description: >-
  The Roomba button: idle starts a clean, cleaning sends the robot home, paused
  resumes, and a stuck robot notifies.
kind: module
engine_api: ">=1.0.0 <2.0.0"
license: mit
requires_slots: [vacuum]
provides:
  - path: packs/official/roomba/roomba.yaml
    class: automation
behaviours:
  - name: start_cleaning
    trigger: state
    condition: state
    match: [docked, idle]
    action: service
    priority: 30
    services: [vacuum.start]
    slots: [vacuum]
  - name: send_home
    condition: state
    match: [cleaning]
    action: service
    priority: 30
    services: [vacuum.return_to_base]
    slots: [vacuum]
  - name: resume_cleaning
    condition: state
    match: [paused]
    action: service
    priority: 20
    services: [vacuum.start]
    slots: [vacuum]
  - name: notify_stuck
    condition: state
    match: [error]
    action: service
    priority: 40
    services: [notify.send_message]
i18n:
  default:
    pack: Roomba
    description: One button that drives the robot vacuum through its states.
    start_cleaning: Starts a clean when the robot is idle.
    send_home: Sends the robot home when it is cleaning.
    resume_cleaning: Resumes a paused clean.
    notify_stuck: Notifies when the robot is stuck.
