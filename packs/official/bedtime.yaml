# The Bedtime button pack -- task 7.1.
#
# A `module`: the kind that does something in a room, plugged into the room's
# placeholders and carrying the behaviours that act through them. "Bedtime" is
# the name a person gives the module, and the button is what they press in the
# room -- the module is what the press *does*.
#
# **There is no button slot, and the absence is a fact about the engine.** A
# press is an *event*: something happened between two instants. Every reading the
# engine takes is a *level* -- a behaviour acts while the readings it names
# currently hold -- so there is no way to say "the button was pressed" in a
# manifest, and a `slots:` clause declaring the button would be a device whose
# reading nothing consults: a name a person binds to a button that does nothing.
# The pack therefore reaches the room's roles and no device of its own. What a
# pack declares a slot *for* is `packs/official/fridge-guard.yaml`, where the
# contact's level -- open, closed -- is the whole of the question.
#
# **The four acts of `spec.txt:58`, and the clause that carried the fourth.**
# "lights off, Sleep mode, optional thermostat, locks off by default". Sleep mode
# was absent until `pack-manifest/1.3.0` added `mode`, the value beside the
# `action` kind's `service`: 1.2.0's `action` axis was a block kind with no value
# beside it, so a manifest could say a behaviour ends in a service call and could
# not say that it also puts the house to sleep. `lights_off` now carries
# `mode: sleep`, so one tick turns the room's lights off *and* enters the mode --
# the engine applies the mode after it has arbitrated the tick's commands
# (`Engine._enter_modes`), which is why a mode is an ask the interpreter makes
# through the context rather than a command it proposes. The thermostat
# behaviour below is the optional clause the spec asks for, and it is inert in a
# room with no `climate_zone` bound -- the `optional_slots` contract, not a
# branch.
#
# The lock clause is off by default by construction and not by a flag: every
# behaviour a pack declares installs disabled (`pack-install`, "installation is
# not activation"), so a house that never enables `lock_up` never locks a door.
# The spec's "locks off by default" is that property, stated here rather than
# re-implemented.
#
# `light.turn_off` is the only service the lights behaviour calls; the lock
# behaviour calls `lock.lock`, which is *not* on `catalog/pack-policy.yaml`'s
# flagged list -- `lock.unlock` is, and this pack does not unlock anything.
name: bedtime
version: "1.0.0"
description: >-
  The bedtime button: the room's lights go off for the night, the thermostat
  drops, and the doors lock.
kind: module
engine_api: ">=1.0.0 <2.0.0"
license: mit
requires_slots: [light_group]
optional_slots: [climate_zone, lock]
provides:
  - path: packs/official/bedtime/bedtime.yaml
    class: automation
behaviours:
  - name: lights_off
    trigger: state
    condition: state
    action: service
    priority: 50
    services: [light.turn_off]
    slots: [light_group]
    mode: sleep
  - name: thermostat_down
    action: service
    priority: 10
    services: [climate.set_temperature]
    slots: [climate_zone]
  - name: lock_up
    action: service
    priority: 10
    services: [lock.lock]
    slots: [lock]
i18n:
  default:
    pack: Bedtime
    description: >-
      Turns the lights off and settles the house for the night.
    lights_off: Turns the room's lights off.
    thermostat_down: Drops the thermostat for the night.
    lock_up: Locks the doors for the night.
