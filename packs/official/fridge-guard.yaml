# The fridge-guard pack -- the shipped example of a pack that brings a device.
#
# Every other pack in this directory is a `module` over slots `catalog/slots.yaml`
# already declares: a room *is* a room, so a bathroom has a `fan` and a hall has a
# `motion_sensor`. This one is the case the vocabulary cannot cover, because a
# fridge is not a room. "Warn me when the fridge has been open too long" needs a
# contact on the fridge door, no room type provides one, and widening
# `catalog/slots.yaml` for every appliance a pack might watch is what would stop
# the vocabulary being a vocabulary.
#
# So the pack declares it, in the `slots` clause `pack-manifest/1.3.0` adds. Three
# rules decide what the declaration means, and this file exercises the first two
# (`engine/declared_slots.py` states all three):
#
#   - `fridge_contact` is a name the catalog does not carry, so it **joins the
#     vocabulary** for the houses that install this pack. The room it lands in can
#     then bind it, which is what makes the pack's own requirement fillable.
#   - The declaration does **not** write `separate: true`, so the name is
#     *shared*: a second pack declaring `fridge_contact` asks for the same device
#     rather than minting a second one. That is the default because it is what a
#     person means -- one fridge, one door -- and a pack that wanted a device of
#     its own would say `separate: true` and bind under `fridge_guard__fridge_contact`.
#
# **"Longer than x minutes" is the pack's own `open_for` option**, and this
# behaviour is the shipped example of a pack that reads one. Three clauses say
# what used to be unsayable, and they are read in this order by
# `engine/behaviours/declared.py`:
#
#   - `slots: [fridge_contact, light_group]` puts the *observed* device first and
#     the *acted-on* device last, which is the convention the module docstring
#     states: `match` and `for` are about the first slot, `services` act on the
#     last.
#   - `match: ["on"]` says what "open" reads as. The quotation is load-bearing --
#     YAML 1.1 reads a bare `on` as the boolean `true` and the schema refuses it
#     with a message naming neither the clause nor the file.
#   - `for: open_for` names the `duration` option below, so the behaviour waits
#     until the contact has read `on` for that many seconds. The number is a
#     *setting*: the panel draws it as a number field, a room can override it, and
#     the person who finds two minutes too short does not edit this file.
#
# The alarm is raised through `light_group` -- the room's own lights, which
# `catalog/services.yaml` maps `light.turn_on` to. The fridge contact is what the
# behaviour observes and the light group is what its services act on, which is the
# observed-first, action-last order `engine/behaviours/declared.py` reads.
name: fridge_guard
version: "1.0.0"
description: >-
  Watches the fridge door and raises the alarm when it has been left open: the
  shipped example of a pack that declares a device of its own.
kind: module
engine_api: ">=1.0.0 <2.0.0"
license: mit
requires_slots: [light_group]
slots:
  - name: fridge_contact
    accepts_domains: [binary_sensor]
    required: true
provides:
  - path: packs/official/fridge_guard/fridge_open.yaml
    class: automation
options:
  - key: open_for
    type: duration
    default: 120
    title: Door left open for
    description: >-
      How long the door may stand open before the room's lights are used to warn
      about it.
    unit: seconds
    minimum: 5
    maximum: 3600
behaviours:
  - name: fridge_left_open
    trigger: state
    condition: state
    action: service
    priority: 30
    services: [light.turn_on]
    slots: [fridge_contact, light_group]
    match: ["on"]
    for: open_for
i18n:
  default:
    pack: Fridge guard
    description: Raises the alarm when the fridge has been left open.
    fridge_left_open: The fridge has been open too long
