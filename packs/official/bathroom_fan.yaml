# The bathroom fan pack -- task 7.3.
#
# A `module` over the `fan` slot `catalog/slots.yaml` was widened with (task
# 2.1): an extractor that runs while the bathroom is in use and stops after a
# run-on period. It is hand-written, so it carries no `derives_from` -- the
# `HANDWRITTEN` marker is the rule that a person's writing reproduces no row's
# expression, and `modes.room_mode_off` is the row whose *idea* this reproduces
# without its expression.
#
# **The run-on period would need a `delay`, and a delay cannot carry its
# duration here.** `delay` is a published action term and is deliberately *not*
# forbidden, but a behaviour's `action` axis names the kind and carries no value
# -- there is nowhere in `pack-manifest/1.2.0` to put "fifteen minutes". So the
# run-on is deferred with the clause that would express it, and the pack ships
# the two acts a fan has: on, and off. A house that wants the run-on drives the
# `fan_off` behaviour on its own schedule, which is the engine's business rather
# than this manifest's.
#
# The two behaviours share the one `fan` slot; the humidity and motion readings a
# bathroom offers are declared optional because the pack can be told to run on
# either, and a room that binds neither still installs it.
name: bathroom_fan
version: "1.0.0"
description: >-
  The bathroom fan: it runs while the room is in use and stops when the run-on
  period ends.
kind: module
engine_api: ">=1.0.0 <2.0.0"
license: mit
requires_slots: [fan]
optional_slots: [humidity_sensor, motion_sensor]
provides:
  - path: packs/official/bathroom_fan/bathroom_fan.yaml
    class: automation
behaviours:
  - name: fan_on
    trigger: state
    condition: state
    action: service
    priority: 20
    services: [fan.turn_on]
    slots: [fan]
  - name: fan_off
    condition: state
    action: service
    priority: 10
    services: [fan.turn_off]
    slots: [fan]
i18n:
  default:
    pack: Bathroom fan
    description: Runs the extractor fan while the bathroom is in use.
    fan_on: Turns the fan on.
    fan_off: Turns the fan off after the run-on period.
