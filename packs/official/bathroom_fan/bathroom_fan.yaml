# What `packs/official/bathroom_fan.yaml` confers, and the file its `provides`
# entry pins. The entry declares the class `automation`; this file is that
# artefact.
#
# Documentation rather than input, and the class is read off the file. The fan is
# reached by the slot the manifest declares and never by a device id.
alias: Bathroom fan
trigger:
  - platform: state
    entity_id: fan
    to: "on"
action:
  - service: fan.turn_on
    target:
      entity_id: fan
