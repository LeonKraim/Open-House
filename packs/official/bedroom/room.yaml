# What `packs/official/bedroom.yaml` confers, and the file its `provides` entry
# pins. The entry declares the class `other`; this file is that artefact.
#
# It is documentation and not input: the engine binds the manifest's
# `requires_slots`, and the interpreter never reads this file -- the same division
# `packs/official/example_pack/motion_light.yaml` is written to. What it is for is
# the other direction of the same idea, a person reading the shipped set to see
# what a bedroom hands over.
#
# Slots, not entities: `climate_zone, light_group, ambient_light_sensor, media_player, motion_sensor, scene_selector, temperature_sensor` are the placeholders a person binds their own
# devices to, which is why no house, room or `domain.object_id` appears here.
slots: [climate_zone, light_group, ambient_light_sensor, media_player, motion_sensor, scene_selector, temperature_sensor]
