# seed: 8 of catalog/edge_cases.yaml -- a long-absence mode, and the timestamps
# that measure how long the house has been empty, are lost or wrongly restored
# when Home Assistant restarts, so an absence is truncated or a stale mode is
# left switched on long after the family is already back.
#
# Read this one against what Phase 1 can decide rather than against what the seed
# asks for. The home's state is the engine's own variable -- modes live in the
# engine's `ModeSet` and no entity carries them, so there is nothing a restart can
# leave switched on -- and no operation activates a mode except `restore`, which
# this scenario does not use because the seed is about a restart and not about a
# document. (A `restore` step accepts an inline document, so a scenario *can* make
# away mode true; see `test_a_restored_away_mode_reaches_the_unit` for the route,
# pinned.) So the stale-mode half of the seed is what is decided here: a house
# that is empty and lit across a restart is not left in away mode by the restart,
# and the away behaviour declines rather than acting.
name: the house restarts mid-absence
given:
  house: minimal
  seed: 19
  started_at: "2026-01-01T23:00:00+00:00"
  enable_flags:
    behaviour.away_shutdown.enabled: true
when:
  - set_state:
      entity_id: light.foyer
      state: "on"
  - set_state:
      entity_id: light.living_room
      state: "on"
  - advance_time:
      minutes: 30
  - restart: {}
  - set_state:
      entity_id: light.foyer
      state: "on"
  - set_state:
      entity_id: light.living_room
      state: "on"
  - advance_time:
      minutes: 30
then:
  - log:
      because:
        rule: lighting.away_shutdown
        outcome: declined
