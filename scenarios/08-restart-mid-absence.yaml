# seed: 8 of catalog/edge_cases.yaml -- a long-absence mode, and the timestamps
# that measure how long the house has been empty, are lost or wrongly restored
# when Home Assistant restarts, so an absence is truncated or a stale mode is
# left switched on long after the family is already back.
#
# Read this one against what Phase 1 can decide rather than against what the seed
# asks for. The guard this seed records stores and restores the away timestamps
# and reconciles a stale mode at startup. Phase 1 keeps modes in the engine's
# `ModeSet` and the away gate reads that set -- and no operation activates a mode
# except `restore`, which this scenario does not use. (A `restore` step accepts
# an inline document, so a scenario *can* make away mode true; this one does not,
# because the seed is about a restart and not about a document. See
# `test_a_restored_away_mode_reaches_the_unit` for the route, pinned.) The
# `house_mode` *entity* is not the gate; the behaviour reads it so the binding
# appears in the record and then declines on the gate. So the scenario states the
# provocation and asserts what is true of it: the mode entity is where the
# house's startup condition puts it, and the away behaviour declined rather than
# acted.
name: the house restarts mid-absence
given:
  house: minimal
  seed: 19
  started_at: "2026-01-01T23:00:00+00:00"
  enable_flags:
    behaviour.away_shutdown.enabled: true
when:
  - set_state:
      entity_id: input_select.house_mode
      state: "away"
  - advance_time:
      minutes: 1
  - restart: {}
  - advance_time:
      minutes: 1
then:
  - state:
      entity_id: input_select.house_mode
      is: "home"
  - log:
      because:
        rule: lighting.away_shutdown
        outcome: declined
