# seed: 6 of catalog/edge_cases.yaml -- a single gust crosses three alert
# thresholds at once, so three separate wind warnings arrive together and the
# household cannot tell which one the weather is actually at.
#
# The guard this seed records restarts rather than queues, and settles briefly
# before sending. Phase 1 has neither a wind vocabulary nor an announcement
# channel, so the scenario states the provocation -- one reading above every tier
# -- and the claim that is Phase 1's to make: the reading is a single value the
# house holds, and nothing acted on it.
name: wind crosses three thresholds in one reading
given:
  house: minimal
  seed: 13
  started_at: "2026-01-01T14:00:00+00:00"
when:
  - add_entity:
      entity_id: sensor.wind_speed
      state: "9"
      attributes:
        unit_of_measurement: "m/s"
  - advance_time:
      minutes: 1
  - set_state:
      entity_id: sensor.wind_speed
      state: "31"
  - advance_time:
      minutes: 1
then:
  - state:
      entity_id: sensor.wind_speed
      is: "31"
  - log:
      must_not:
        - outcome: acted
