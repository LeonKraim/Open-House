# The shipped Roomba pack -- `packs/official/roomba.yaml`'s `start_cleaning`.
#
# The vacuum is bound in a room rather than at house scope, and that is the
# vocabulary's rule rather than this scenario's choice: `catalog/room_types.yaml`
# lists `vacuum` among the house's slots, and a house-scope slot is resolved by
# collecting its members out of the rooms, so a house that binds it nowhere
# resolves it empty and the pack's required slot fails (`openhouse/packs.py`'s
# `_supplied`).
#
# The assertion cites the record rather than the vacuum's state. The behaviour
# proposes `vacuum.start`, and the fake port writes the proposed action as the
# state, so the vacuum reads `vacuum.start` afterwards -- a service name where a
# state should be, which is the recorded gap in `engine/behaviours/declared.py`
# and not something this pack's scenario should pin as though it were intended.
name: the Roomba starts cleaning
given:
  house:
    name: Roomba House
    rooms:
      - id: foyer
        name: Foyer
        type: foyer
        bindings:
          vacuum:
            entity_id: vacuum.roomba
    house_scope:
      slots: [vacuum]
  seed: 11
  started_at: "2026-01-01T23:00:00+00:00"
  enable_flags:
    module.roomba.enabled: true
    behaviour.roomba.start_cleaning.enabled: true
when:
  - install_pack:
      manifest: packs/official/roomba.yaml
  - advance_time:
      minutes: 1
then:
  - log:
      because:
        rule: start_cleaning
        outcome: acted
