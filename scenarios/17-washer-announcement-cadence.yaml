# seed: 17 of catalog/edge_cases.yaml -- a finished load of washing is announced
# again and again until someone empties the machine, so the reminder becomes
# noise the household tunes out.
#
# The guard this seed records compares the announcement automation's own last run
# against the current time and declines inside the past hour, so the same
# completion is announced once and then at most hourly. Phase 1 has no announcer
# and no rate-limited notification channel, but it does have a rate limiter the
# engine applies after arbitration, and the turn of the clock the cadence would
# be measured over is exactly what this scenario advances. The claim Phase 1 can
# make is that the load stays finished for the hours the cadence spans and
# nothing acted.
name: a finished load sits in the machine for hours
given:
  house: minimal
  seed: 59
  started_at: "2026-01-01T09:00:00+00:00"
when:
  - add_entity:
      entity_id: sensor.washer_power
      state: "0"
      attributes:
        unit_of_measurement: "W"
  - advance_time:
      minutes: 1
  - advance_time:
      minutes: 180
then:
  - state:
      entity_id: sensor.washer_power
      is: "0"
  - log:
      must_not:
        - outcome: acted
