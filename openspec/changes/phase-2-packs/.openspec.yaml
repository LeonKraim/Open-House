schema: spec-driven
created: 2026-10-01
goal: "Phase 2 of the Open House implementation plan: the pack system. A
  declarative-only pack interpreter with a capability sandbox (only bound
  entities, only declared services, a banned-service list, red-flagged dangerous
  permissions); a manifest carrying dependencies, conflicts, an engine_api semver
  range, a licence from the published vocabulary and i18n strings; the five pack
  kinds (module,
  room-template, behavior, profile-set, house-template); official packs (the
  Bedtime button, the Roomba button, the bathroom fan, guest mode, the default
  room templates, and the packs derived from the merged 83-row catalogue under
  each row's own reuse_status and licence); triggers from a dashboard button or a
  physical button; and a pack CLI (validate, test, diff-permissions). Exit:
  official packs pass validation and scenarios, and two modules cannot fight over
  one light. Installation is not activation: every behaviour a pack declares
  stays OFF until something enables it."
