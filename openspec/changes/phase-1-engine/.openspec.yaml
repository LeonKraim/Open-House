schema: spec-driven
created: 2026-10-01
goal: "Phase 1 of the Open House implementation plan: the engine and the full
  mock house. A HouseAdapter port and a fully controllable FakeHouseAdapter
  (every entity a mock: add/remove, set state, manual user actions, unavailable
  devices, injected faults, restarts); a deterministic substrate (virtual clock,
  seeded randomness, no network, snapshot/restore); the engine core (optional
  and list-capable slot binding, a layered config resolver with its layer order
  fixed, house modes, arbitration and priorities, manual-override detection,
  rate limits, and a decision log that is the test oracle); the first behaviours
  (motion lighting with lux-then-sun fallback, override, away shutdown); a
  scenario runner with a YAML DSL, Hypothesis invariants, mutation testing and
  JSON failure output; fixture houses (minimal, messy, 150+ devices, no lux
  sensors); and a CLI, library and MCP server exposing advance_time, set_state,
  user_action, inject_fault, snapshot/restore, get_decision_log, install_pack,
  export_config and import_config. Exit: an AI agent can build a house, run
  scenarios, read the log and iterate with no HA installed. Two product rules
  bind the phase: modules and behaviours are OFF by default and every one can be
  turned off, and nothing may ever auto-unlock a door or auto-open a garage."

# The capability specs under specs/<capability>/spec.md are authored by a later
# stage of this workflow (see design.md's "Capability decomposition" for the
# seven capabilities and what each spec must hold). The `first-behaviours` spec
# has landed, so the skip_specs key that let the package validate while it
# declared no deltas is removed; the remaining capability specs land the same
# way, each in the change that writes it.
