[project]
name = "oh-tools"
version = "0.1.0"
description = "Validation and generation tooling for the Open House catalog."
requires-python = ">=3.12"

# This list is normative, not incidental. The engine-purity invariant in
# `specs/architecture-invariants/spec.md` reads exactly this array as the
# declared dependency list and fails any import under `engine/` that is neither
# stdlib, first-party, nor named here. Adding a dependency is therefore a change
# to an enforced boundary, which is the point: an undeclared import is a build
# failure rather than a surprise at runtime.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    # `referencing` is what `jsonschema` itself uses to resolve a `$ref`, and the
    # catalog schemas use cross-file ones (`../slot/1.0.0.json`). Importing it
    # through `jsonschema` is not possible -- it is not re-exported -- so it is
    # named here rather than relied on as a transitive dependency that could be
    # dropped by an upstream release without this repository noticing.
    "referencing>=0.35",
    "typer>=0.12",
    # The official MCP Python SDK, the outward face of the composition root
    # (`openhouse/mcp_server.py`). It is a runtime dependency rather than a dev
    # one because the MCP server is part of the product an agent drives, not
    # part of the test harness, and it is named here rather than left
    # transitive because this array is the single declaration the engine-purity
    # check reads: a distribution absent from it is one no module may import.
    # Pinned to the v2 stable line, the current release at the time of writing
    # -- `spec.txt` asks that the SDK's current version be verified before it is
    # pinned, and a future version bump is a change to this enforced boundary
    # like any other.
    "mcp>=2.2",
]

[project.scripts]
oh-catalog = "tools.catalog.cli:main"
# The control surface's command-line face, over the same registry the MCP server
# advertises (`openhouse/cli.py`, `openhouse/mcp_server.py`). It is the entry
# point `spec.txt`'s Phase 1 exit criterion is driven through: an agent builds a
# house, runs scenarios and reads the decision log without Home Assistant
# installed, and this is the command it does that with.
oh-house = "openhouse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    # Mutation testing over `engine/`, with `sim/` measured separately (design
    # D13); the survivor threshold and the report naming survivors are task
    # 9.5's, and this only declares the tool they run through.
    "mutmut>=3.8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Every importable layer of the product ships, not only the catalog tooling: the
# adapter port, the engine, the simulator and the composition root together are
# what `oh-house` drives, and a wheel carrying `openhouse` alone would install a
# console script that cannot import what it is a face of. `custom_components/` is
# deliberately absent -- it is Home Assistant's own layout, loaded by that
# runtime from a config directory rather than installed as a distribution.
packages = ["tools", "openhouse", "engine", "sim", "ha_adapter"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]
# `E501` is line length, which the formatter already owns; leaving it on would
# make the linter and the formatter disagree about the same line.
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["tools"]
# The engine skeleton is deliberately empty in Phase 0 -- its purity is asserted
# rather than exercised -- so strict checking there would report nothing useful.
exclude = ["engine", "ha_adapter", "sim", "custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
