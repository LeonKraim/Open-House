# The integration, add-on and bridge dependency ledger.
#
# Schema: schemas/catalog/integrations.json. Validate with `oh-catalog validate`.
#
# Every integration, add-on or bridge a reference repo relies on carries the
# repos that use it and a disposition of require, replace or avoid. An
# integration used by three or more repos is required -- three independent
# households reaching for the same dependency is the corroboration that makes
# it safe to assume on a stranger's behalf; below three it is one person's
# choice and the ledger says so rather than promoting it. A `replace` or
# `avoid` names its successor, because a disposition with nothing behind it is
# an opinion.
#
# Evidence, stated once so a reader can check it: a repo uses an entry when its
# tracked configuration says so -- a domain key, a `platform:`/`domain:`
# reference, a `custom_components/` directory, a HACS-served `/hacsfiles/`
# resource, a per-integration config directory or file under the repo (a
# `mqtt:` block, an `esphome/` tree, a `spotcast.yaml`), or an entity or service
# identifier the integration is the only source of (`sensor.glances_*`,
# `alarmo.arm`, `switch.adaptive_lighting_*`). No name here is taken from a
# repo's README: two of the four grant no licence to reuse their prose, and a
# dependency the config does not show is a dependency we have not verified. The
# consequence is that the ledger is a floor rather than a ceiling -- a repo that
# installs something it never configures leaves no trace, and this file reports
# what the tree evidences, not what a README claims.
#
# The entries below are the union of that evidence across all four clones, read
# once by a person and committed. The groups are a reading order, not a
# mechanism; only `name`, `repos`, `disposition` and `replacement` are read.
# `alexa` (the cloud skill) and `alexa_media` (the community media-player
# bridge) are distinct dependencies and are recorded separately for that reason.

integrations:
  # --- Bridges and transports ----------------------------------------------
