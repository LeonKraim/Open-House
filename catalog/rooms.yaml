# Every room that exists in any of the four setups, with its source repo and paths.
#
# Schema: schemas/catalog/rooms.json. Validate with `oh-catalog validate`.
#
# One record per room, and `paths` is the room's evidence: every selected file in
# the repo that names it. The unit is the room and not the file, so a room that
# turns up in a package directory, a dashboard and a set of helpers is one record
# carrying three paths rather than three records -- otherwise "does this setup
# have a kitchen" would have as many answers as the kitchen has files.
#
# Names are kept as their repo spells them, including non-English ones: this file
# is the evidence base the room-type map is derived from, and normalising a name
# here would destroy the evidence.
#
# What counts as a room is a rule, settled here once because the room-type map's
# coverage is bounded by this file and a judgement re-made at every entry is how
# a real room goes missing. A name is a room when its repo configures behaviour
# for that space: it is an area in the repo's own vocabulary (an area definition,
# a room-valued helper, a room dashboard) or it carries a body of behaviour of
# its own. Outdoor and property areas are rooms on that rule rather than
# exceptions to it -- a gazebo, a pool, a driveway and a porch each carry
# occupancy, lighting or camera behaviour here exactly as an indoor room does.
# The narrower standard, that only enclosed spaces count, is rejected because it
# would drop ccostan's driveway and johnkoht's gazebo and pool, and the union of
# real rooms recorded here is the bound on what a later phase can express, so
# truncating it is the one thing this file must not do.
#
# `paths` is not hand-kept. `tools/catalog/rooms.py` re-derives it from
# `catalog/inventory.json` and fails on any difference in either direction, so a
# selected file that names the room cannot be left out of the list and a path
# that does not name it cannot be put in.
