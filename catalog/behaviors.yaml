# The shipped corpus: one row per behaviour, merged across the repos that had it.
#
# Schema: schemas/catalog/behaviors.json. Validate with `oh-catalog validate`.
#
# A row separates what the behaviour *is* -- `concept`, always populated and
# always in our own words -- from how a particular repo *spelled* it, which is
# `expression` and is populated only when every source repo's code grant permits
# reuse. `license`, `reuse_status` and `obligations` are derived from the code
# halves of `catalog/licenses.yaml`; `tools/catalog/behaviors.py` recomputes them
# and fails a hand-written value the derivation contradicts.
#
# `retention: audit` marks a discarded row: a behaviour tied to one named person
# is kept as the record that we saw it, never as a shipped default.
#
# Every row cites the raw ids in `catalog/raw-behaviors.json` it was derived from.
# The unclaimed register lives on that file: a raw record no row claims carries a
# reason from the closed set, and its count is reported on every run.
behaviors:
- id: lighting.motion_light_on
