# Per-repo licence records.
#
# Schema: schemas/catalog/licenses.json. Validate with `oh-catalog validate`.
#
# One record per reference repo, split by artifact kind because a repo's code
# and its prose can be under different licences. Two of the four grant nothing
# at all, and the corpus is built on that being true rather than on it being
# inconvenient.
#
# `reuse_status_code`, `reuse_status_prose` and `obligations` are **derived**
# from `license_code` and `license_prose` by `tools/catalog/licenses.py`, using
# the table published in the `attribution` spec. They are written here because
# the schema requires a complete record, and the check re-derives them and fails
# any that disagrees -- so they are the table's output, not a second opinion.
# Nothing in this file is a judgement made at the point of use.
#
# `repo` is the repository's owner handle, lowercased. It is the token
# `docs/reference/<repo>.md` is named for and the name `repos.yaml` carries once
# task 4.1 writes it; the full URL lives in that file's `repo_url`, so it is not
# repeated here.
#
# `license_file` is null where no licence file exists, and null means
# `no_licence` for both kinds whatever the README says -- a claim is not a
# grant. Where a claim exists and the file does not, the discrepancy is recorded
# beside it, because a claim with no recorded discrepancy is one a later reader
# takes as settled.

repos:
  - repo: ccostan
    author: Carlo Costanzo
    license_code: mit
    license_prose: mit
    license_file: LICENSE
    reuse_status_code: reusable
    reuse_status_prose: reusable
    obligations:
      - attribution

  - repo: renemarc
    author: René-Marc Simard
    license_code: apache_2_0
    license_prose: cc_by_nc_sa
    license_file: LICENSE.txt
    reuse_status_code: reusable
    reuse_status_prose: ideas_only
    obligations:
      - attribution
      - state_changes

  - repo: fwartner
    author: Florian Wartner
    license_code: no_licence
    license_prose: no_licence
    license_file: null
    reuse_status_code: ideas_only
    reuse_status_prose: ideas_only
    obligations: []
    readme_licence_claim: MIT
    licence_claim_discrepancy: >-
      The README's Licence section declares MIT and links to choosealicense.com,
      but the repository ships no licence file. A README sentence is a statement
      about the work, not a grant of rights in it, so no licence attaches to
      either artifact kind and this record is `no_licence` for both. The claim is
      kept because it is evidence of the author's intent and the starting point
      for the contact ask in docs/reference/author-contact.md.
    author_contact:
      channel: github-issue
      attempted_on: null
      outcome: not_attempted
      reason: >-
        Making contact is an outward-facing action and requires the user's
        explicit authorisation, which has not been given. Until it is, no
        message has been sent and the repo remains `ideas_only` for code and
        prose alike.

  - repo: johnkoht
    author: John Koht
    license_code: no_licence
    license_prose: no_licence
    license_file: null
    reuse_status_code: ideas_only
    reuse_status_prose: ideas_only
    obligations: []
    author_contact:
      channel: github-issue
      attempted_on: null
      outcome: not_attempted
      reason: >-
        Making contact is an outward-facing action and requires the user's
        explicit authorisation, which has not been given. This repo carries no
        licence file and no README claim either, so there is not even a stated
        intent to point at; absent a grant it stays `ideas_only` for code and
        prose alike.
